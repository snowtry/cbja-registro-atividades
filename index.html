
<style>
:root {
  color-scheme: dark;
  --bg: #091a12;
  --panel: #10291d;
  --panel2: #193b2a;
  --line: #315a40;
  --text: #f4f5ed;
  --muted: #b0c3b5;
  --gold: #d8b45a;
  --gold-dark: #a9842e;
  --green: #1c4a30;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: radial-gradient(ellipse at top, #183a28, var(--bg) 70%);
  color: var(--text);
  font: 15px/1.55 system-ui, -apple-system, Segoe UI, sans-serif;
}

svg {
  width: 20px;
  height: 20px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}

header {
  padding: 26px max(20px, calc((100% - 1080px) / 2));
  background: linear-gradient(120deg, #17452e, #0b2418);
  border-bottom: 2px solid var(--gold-dark);
  box-shadow: 0 8px 30px #0003;
}

.brand {
  display: flex;
  gap: 14px;
  align-items: center;
}

.logo {
  width: 52px;
  height: 52px;
  border: 1px solid var(--gold);
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, #285a3b, #102d1e);
  color: var(--gold);
}

.logo svg {
  width: 29px;
  height: 29px;
}

h1 {
  font-size: clamp(21px, 4vw, 29px);
  margin: 0;
  letter-spacing: .2px;
}

header p {
  margin: 4px 0 0;
  color: var(--muted);
}

main {
  max-width: 1080px;
  margin: 26px auto;
  padding: 0 18px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.card {
  background: linear-gradient(145deg, var(--panel), #0c2419);
  border: 1px solid var(--line);
  border-top: 2px solid var(--gold-dark);
  border-radius: 15px;
  padding: 18px;
  box-shadow: 0 5px 18px #0002;
  transition: .2s;
}

.card:hover {
  border-color: var(--gold);
  transform: translateY(-2px);
}

.stat-label {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 13px;
}

.stat-label svg {
  color: var(--gold);
  width: 17px;
  height: 17px;
}

.stat-value {
  color: var(--gold);
  font-size: 27px;
  font-weight: 800;
  margin-top: 5px;
}

.toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 24px 0 16px;
}

.toolbar input,
.toolbar select {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--line);
  padding: 12px 13px;
  border-radius: 10px;
  min-width: 160px;
  flex: 1;
  font: inherit;
  outline: none;
}

.toolbar input:focus,
.toolbar select:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px #d8b45a20;
}

.toolbar input::placeholder {
  color: #9caf9f;
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 22px 0 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}

.section-title {
  display: flex;
  align-items: center;
  gap: 9px;
}

.section-title svg {
  color: var(--gold);
}

.section-head h2 {
  font-size: 19px;
  margin: 0;
}

#status {
  color: var(--muted);
  font-size: 12px;
}

.activity {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr);
  gap: 13px;
  padding: 17px;
  background: linear-gradient(120deg, var(--panel), #0c2419);
  border: 1px solid var(--line);
  border-left: 3px solid var(--gold-dark);
  border-radius: 14px;
  margin-bottom: 11px;
  box-shadow: 0 4px 16px #0002;
  transition: border-color .2s, transform .2s;
}

.activity:hover {
  border-color: var(--gold);
  transform: translateX(2px);
}

.activity-icon {
  width: 44px;
  height: 44px;
  border: 1px solid #b9913c66;
  border-radius: 12px;
  background: linear-gradient(145deg, #28583b, #173b29);
  color: var(--gold);
  display: grid;
  place-items: center;
}

.activity-icon svg {
  width: 22px;
  height: 22px;
}

.activity h3 {
  font-size: 15px;
  margin: 0 0 5px;
  overflow-wrap: anywhere;
}

.profile-link {
  color: var(--gold);
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
}

.profile-link:hover {
  text-decoration: underline;
}

.meta {
  color: var(--muted);
  font-size: 13px;
  overflow-wrap: anywhere;
}

.details {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 9px;
  font-size: 12px;
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #1a3a29;
  border: 1px solid #456b49;
  border-radius: 999px;
  padding: 4px 10px;
  color: #e9d69e;
  overflow-wrap: anywhere;
  max-width: 100%;
}

.tag svg {
  width: 14px;
  height: 14px;
}

.note {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  margin-top: 9px;
  color: var(--muted);
  font-size: 13px;
  overflow-wrap: anywhere;
}

.note svg {
  width: 16px;
  height: 16px;
  color: var(--gold);
}

.empty {
  padding: 34px 20px;
  text-align: center;
  color: var(--muted);
  background: var(--panel);
  border: 1px dashed var(--line);
  border-radius: 14px;
}

.empty svg {
  display: block;
  width: 30px;
  height: 30px;
  color: var(--gold);
  margin: 0 auto 10px;
}

footer {
  max-width: 1080px;
  margin: 30px auto 0;
  padding: 20px 18px 30px;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
  border-top: 1px solid var(--line);
}

footer strong {
  color: var(--gold);
}

@media (max-width: 600px) {
  header {
    padding: 22px 16px;
  }

  main {
    margin: 20px auto;
    padding: 0 13px;
  }

  .stats {
    grid-template-columns: 1fr;
  }

  .stat-value {
    font-size: 24px;
  }

  .section-head {
    align-items: flex-start;
    flex-direction: column;
  }

  .toolbar input,
  .toolbar select {
    min-width: 100%;
  }

  .activity {
    padding: 13px;
    gap: 10px;
    grid-template-columns: 40px minmax(0, 1fr);
  }

  .activity-icon {
    width: 40px;
    height: 40px;
  }
}
</style>
